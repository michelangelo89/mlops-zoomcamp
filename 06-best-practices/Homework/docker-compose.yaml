version: '3.8'

services:
  localstack:
    image: localstack/localstack:3
    container_name: localstack_s3
    ports:
      - "4566:4566"    # main Localstack endpoint
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - "./localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"